name: relay-image

# 把 Docker Hub 上的镜像搬运到本仓库的 ghcr 命名空间。
# Actions runner 在境外，拉 Docker Hub 满速；国内再从 ghcr.io 拉，实测 24 MB/s。
# skopeo copy 逐层流式转发，不解压、不落完整副本。

on:
  workflow_dispatch:
    inputs:
      source:
        description: '源镜像（含 tag）'
        required: true
        default: 'docker.io/lmsysorg/sglang:v0.5.19-cu130'
      target_name:
        description: 'ghcr 上的包名'
        required: true
        default: 'sglang'
      target_tag:
        description: 'ghcr 上的 tag'
        required: true
        default: 'v0.5.19-cu130'

jobs:
  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 腾空间（runner 默认盘小，先删掉用不上的预装内容）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: 装 skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: 登录 ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 搬运
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SRC="${{ inputs.source }}"
          DST="ghcr.io/${OWNER}/${{ inputs.target_name }}:${{ inputs.target_tag }}"
          echo "::notice::$SRC  ->  $DST"
          # 只搬 linux/amd64，省一半时间和空间
          skopeo copy --retry-times 5 --override-os linux --override-arch amd64 \
            "docker://${SRC}" "docker://${DST}"
          echo "::notice::完成 $DST"

      - name: 核对
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          DST="ghcr.io/${OWNER}/${{ inputs.target_name }}:${{ inputs.target_tag }}"
          skopeo inspect "docker://${DST}" | head -30
          echo "压缩总量:"
          skopeo inspect --raw "docker://${DST}" | \
            python3 -c "import sys,json;d=json.load(sys.stdin);print(sum(l['size'] for l in d['layers'])/2**30,'GiB',len(d['layers']),'层')"
